<!DOCTYPE html>
<html lang="uk">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>УкрЧат</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(
        180deg,
        #ffd900 0%,
        #ffd900 50%,
        #0057b8 50%,
        #0057b8 100%
    );
    height: 100vh;
    overflow: hidden;
}

/* =========================
   HEADER
   ========================= */

.header {
    height: 60px;
    background: white;
    display: flex;
    align-items: center;
    padding: 0 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    position: relative;
    z-index: 20;
}

.header-title {
    font-size: 21px;
    font-weight: bold;
}

/* =========================
   ІСТОРІЯ ЧАТІВ
   ========================= */

.history-panel {
    position: fixed;
    top: 0;
    left: -290px;

    width: 280px;
    height: 100vh;

    background: white;

    z-index: 100;

    box-shadow: 3px 0 15px rgba(0,0,0,.25);

    transition: left .25s ease;

    display: flex;
    flex-direction: column;
}

.history-panel.open {
    left: 0;
}

.history-header {
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    border-bottom: 1px solid #ddd;
}

.history-title {
    font-weight: bold;
    font-size: 18px;
}

.close-history {
    width: 40px;
    height: 40px;

    border: none;
    border-radius: 50%;

    background: #eee;

    font-size: 20px;
}

.new-chat {
    margin: 12px;

    padding: 12px;

    border: none;
    border-radius: 12px;

    background: #ffd900;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 5px 10px;
}

.chat-item {
    padding: 12px;

    border-radius: 12px;

    margin-bottom: 6px;

    cursor: pointer;

    background: #f3f3f3;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.chat-item:hover {
    background: #e5e5e5;
}

.chat-item.active {
    background: #ffd900;
}

/* =========================
   PREMIUM
   ========================= */

.plan-card {
    position: absolute;

    top: 70px;
    right: 10px;

    background: white;

    border-radius: 18px;

    padding: 9px 12px;

    box-shadow: 0 3px 12px rgba(0,0,0,.2);

    z-index: 15;
}

.plan-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 6px;
}

.plan-limits {
    display: flex;
    gap: 7px;
    font-size: 12px;
}

/* =========================
   CHAT
   ========================= */

.chat {
    position: absolute;

    top: 60px;
    bottom: 75px;
    left: 0;
    right: 0;

    overflow-y: auto;

    padding: 80px 12px 15px;
}

/* =========================
   ПОВІДОМЛЕННЯ
   ========================= */

.message {
    max-width: 82%;

    padding: 10px 13px;

    margin: 7px 0;

    border-radius: 18px;

    word-wrap: break-word;

    white-space: pre-wrap;
}

.user {
    margin-left: auto;

    background: white;

    border-bottom-right-radius: 5px;
}

.assistant {
    margin-right: auto;

    background: #f0f0f0;

    border-bottom-left-radius: 5px;
}

/* =========================
   ФОТО
   ========================= */

.message-image {
    display: block;

    max-width: 100%;
    max-height: 400px;

    border-radius: 15px;

    margin-top: 5px;

    object-fit: contain;
}

/* =========================
   НИЖНЯ ПАНЕЛЬ
   ========================= */

.input-area {
    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    min-height: 75px;

    background: #ffd900;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px;
}

/* =========================
   КРУГЛІ КНОПКИ
   ========================= */

.circle-button,
.microphone-button,
.send-button {

    width: 48px;
    height: 48px;

    min-width: 48px;

    border: none;

    border-radius: 50%;

    background: white;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow: 0 2px 7px rgba(0,0,0,.18);
}

.circle-button {
    font-size: 30px;
}

.microphone-button svg {
    width: 24px;
    height: 24px;
}

.send-button {
    font-size: 21px;
}

/* =========================
   ПОЛЕ ПОВІДОМЛЕННЯ
   ========================= */

#messageInput {
    flex: 1;

    min-width: 0;

    height: 48px;

    border: none;

    outline: none;

    border-radius: 24px;

    padding: 0 16px;

    font-size: 16px;

    background: white;
}

/* =========================
   МЕНЮ +
   ========================= */

.plus-menu {
    position: absolute;

    bottom: 70px;
    left: 10px;

    background: white;

    border-radius: 18px;

    padding: 8px;

    box-shadow: 0 4px 15px rgba(0,0,0,.25);

    display: none;

    z-index: 30;
}

.plus-menu button {
    display: block;

    width: 190px;

    border: none;

    background: white;

    text-align: left;

    padding: 12px;

    border-radius: 10px;

    font-size: 15px;

    cursor: pointer;
}

.plus-menu button:hover {
    background: #eeeeee;
}

/* =========================
   ЗАПИС
   ========================= */

.recording {
    background: #ffd6d6 !important;
}

</style>

</head>

<body>


<!-- =========================
     ІСТОРІЯ
     ========================= -->

<div id="historyPanel" class="history-panel">

    <div class="history-header">

        <div class="history-title">
            🗂️ Історія чатів
        </div>

        <button
            id="closeHistory"
            class="close-history">

            ×

        </button>

    </div>

    <button
        id="newChatButton"
        class="new-chat">

        ＋ Новий чат

    </button>

    <div
        id="chatList"
        class="chat-list">

    </div>

</div>


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

    <div class="header-title">
        🇺🇦 УкрЧат
    </div>

</div>


<!-- =========================
     PREMIUM
     ========================= -->

<div class="plan-card">

    <div
        id="planTitle"
        class="plan-title">

        ⭐ Premium

    </div>

    <div class="plan-limits">

        <span>
            📷 <span id="photoLimit">0/0</span>
        </span>

        <span>
            🎥 <span id="videoLimit">0/0</span>
        </span>

        <span>
            📄 <span id="documentLimit">0/0</span>
        </span>

        <span>
            💬 <span id="messageLimit">0/0</span>
        </span>

    </div>

</div>


<!-- =========================
     ЧАТ
     ========================= -->

<div id="chat" class="chat"></div>


<!-- =========================
     МЕНЮ +
     ========================= -->

<div id="plusMenu" class="plus-menu">

    <button onclick="chooseImage()">
        📷 Додати фото
    </button>

    <button onclick="chooseVideo()">
        🎥 Додати відео
    </button>

    <button onclick="chooseDocument()">
        📄 Додати документ
    </button>

</div>


<!-- =========================
     INPUT FILE
     ========================= -->

<input
    id="imageInput"
    type="file"
    accept="image/*"
    style="display:none">

<input
    id="videoInput"
    type="file"
    accept="video/*"
    style="display:none">

<input
    id="documentInput"
    type="file"
    accept=".pdf,.txt,.doc,.docx"
    style="display:none">


<!-- =========================
     НИЖНЯ ПАНЕЛЬ
     ========================= -->

<div class="input-area">

    <button
        id="plusButton"
        class="circle-button">

        +

    </button>

    <input
        id="messageInput"
        type="text"
        placeholder="Повідомлення..."
        autocomplete="off">

    <button
        id="microphoneButton"
        class="microphone-button">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <rect
                x="9"
                y="2"
                width="6"
                height="12"
                rx="3">
            </rect>

            <path
                d="M5 10a7 7 0 0 0 14 0">
            </path>

            <line
                x1="12"
                y1="19"
                x2="12"
                y2="22">
            </line>

            <line
                x1="8"
                y1="22"
                x2="16"
                y2="22">
            </line>

        </svg>

    </button>

    <button
        id="sendButton"
        class="send-button">

        ➤

    </button>

</div>


<script>

/* =========================
   ЕЛЕМЕНТИ
   ========================= */

const chat =
    document.getElementById("chat");

const messageInput =
    document.getElementById("messageInput");

const plusButton =
    document.getElementById("plusButton");

const plusMenu =
    document.getElementById("plusMenu");

const sendButton =
    document.getElementById("sendButton");

const imageInput =
    document.getElementById("imageInput");

const videoInput =
    document.getElementById("videoInput");

const documentInput =
    document.getElementById("documentInput");

const historyPanel =
    document.getElementById("historyPanel");

const chatList =
    document.getElementById("chatList");

const microphoneButton =
    document.getElementById("microphoneButton");


/* =========================
   CHAT ID
   ========================= */

let currentChatId =
    localStorage.getItem(
        "ukrchat_chat_id"
    );


/* =========================
   ДОДАТИ ПОВІДОМЛЕННЯ
   ========================= */

function addMessage(text, role) {

    const message =
        document.createElement("div");

    message.className =
        "message " + role;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   ДОДАТИ ФОТО
   ========================= */

function addImage(
    imageSource,
    role = "user"
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + role;

    const image =
        document.createElement("img");

    image.className =
        "message-image";

    image.src =
        imageSource;

    image.alt =
        "Фото";

    message.appendChild(image);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   СТВОРЕННЯ ЧАТУ
   ========================= */

async function ensureChat() {

    if (currentChatId) {
        return currentChatId;
    }

    const response =
        await fetch("/chats/create", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                title: "Новий чат"
            })

        });

    const data =
        await response.json();

    currentChatId =
        data.id;

    localStorage.setItem(
        "ukrchat_chat_id",
        currentChatId
    );

    loadChats();

    return currentChatId;
}


/* =========================
   НАДІСЛАТИ ПОВІДОМЛЕННЯ
   ========================= */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) {
        return;
    }

    addMessage(
        text,
        "user"
    );

    messageInput.value = "";

    const chatId =
        await ensureChat();

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    message: text,

                    chat_id: chatId

                })

            });

        const data =
            await response.json();

        if (data.reply) {

            addMessage(
                data.reply,
                "assistant"
            );

        }

        if (data.image) {

            addImage(
                data.image,
                "assistant"
            );

        }

        loadUsage();

        loadChats();

    } catch (error) {
                                                              console.log(error);

        addMessage(
            "Не вдалося отримати відповідь.",
            "assistant"
        );

    }
}


/* =========================
   ENTER
   ========================= */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   SEND
   ========================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================
   +
   ========================= */

plusButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        if (
            plusMenu.style.display ===
            "block"
        ) {

            plusMenu.style.display =
                "none";

        } else {

            plusMenu.style.display =
                "block";

        }

    }
);


/* =========================
   ЗАКРИТТЯ +
   ========================= */

document.addEventListener(
    "click",
    function(event) {

        if (
            !plusMenu.contains(
                event.target
            ) &&
            event.target !== plusButton
        ) {

            plusMenu.style.display =
                "none";

        }

    }
);


/* =========================
   ВИБІР ФОТО
   ========================= */

function chooseImage() {

    plusMenu.style.display =
        "none";

    imageInput.click();
}


/* =========================
   ВИБІР ВІДЕО
   ========================= */

function chooseVideo() {

    plusMenu.style.display =
        "none";

    videoInput.click();
}


/* =========================
   ВИБІР ДОКУМЕНТА
   ========================= */

function chooseDocument() {

    plusMenu.style.display =
        "none";

    documentInput.click();
}


/* =========================
   ЗАВАНТАЖЕННЯ ФАЙЛУ
   ========================= */

async function uploadFile(
    input,
    type
) {

    if (
        !input.files ||
        !input.files[0]
    ) {

        return;
    }

    const file =
        input.files[0];

    const chatId =
        await ensureChat();


    if (type === "image") {

        const localImage =
            URL.createObjectURL(file);

        addImage(
            localImage,
            "user"
        );

    } else {

        addMessage(
            "Файл: " + file.name,
            "user"
        );

    }


    const formData =
        new FormData();

    formData.append(
        type,
        file
    );

    formData.append(
        "message",
        "Проаналізуй цей файл."
    );

    if (chatId) {

        formData.append(
            "chat_id",
            chatId
        );

    }


    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                body: formData

            });

        const data =
            await response.json();

        if (data.reply) {

            addMessage(
                data.reply,
                "assistant"
            );

        }

        if (data.image) {

            addImage(
                data.image,
                "assistant"
            );

        }

        loadUsage();

        loadChats();

    } catch (error) {

        console.log(error);

        addMessage(
            "Не вдалося обробити файл.",
            "assistant"
        );

    }

    input.value = "";
}


/* =========================
   FILE INPUTS
   ========================= */

imageInput.addEventListener(
    "change",
    function() {

        uploadFile(
            imageInput,
            "image"
        );

    }
);

videoInput.addEventListener(
    "change",
    function() {

        uploadFile(
            videoInput,
            "video"
        );

    }
);

documentInput.addEventListener(
    "change",
    function() {

        uploadFile(
            documentInput,
            "document"
        );

    }
);


/* =========================
   ІСТОРІЯ ЧАТІВ
   ========================= */

async function loadChats() {

    try {

        const response =
            await fetch("/chats");

        const chats =
            await response.json();

        chatList.innerHTML = "";

        if (chats.length === 0) {

            const empty =
                document.createElement("div");

            empty.style.padding =
                "15px";

            empty.textContent =
                "Історія чатів порожня.";

            chatList.appendChild(empty);

            return;
        }

        chats.reverse();

        chats.forEach(
            function(item) {

                const element =
                    document.createElement("div");

                element.className =
                    "chat-item";

                if (
                    item.id ===
                    currentChatId
                ) {

                    element.classList.add(
                        "active"
                    );

                }

                element.textContent =
                    item.title ||
                    "Новий чат";

                element.onclick =
                    function() {

                        openChat(
                            item.id
                        );

                    };

                chatList.appendChild(element);

            }
        );

    } catch (error) {

        console.log(
            "Помилка історії:",
            error
        );

    }
}


/* =========================
   ВІДКРИТИ ЧАТ
   ========================= */

async function openChat(chatId) {

    try {

        const response =
            await fetch(
                "/chats/" + chatId
            );

        const data =
            await response.json();

        currentChatId =
            chatId;

        localStorage.setItem(
            "ukrchat_chat_id",
            chatId
        );

        chat.innerHTML = "";

        if (data.messages) {

            data.messages.forEach(
                function(message) {

                    addMessage(
                        message.text,
                        message.role
                    );

                }
            );

        }

        historyPanel.classList.remove(
            "open"
        );

        loadChats();

    } catch (error) {

        console.log(
            "Помилка відкриття чату:",
            error
        );

    }
}


/* =========================
   НОВИЙ ЧАТ
   ========================= */

document.getElementById(
    "newChatButton"
).addEventListener(
    "click",
    async function() {

        currentChatId = null;

        localStorage.removeItem(
            "ukrchat_chat_id"
        );

        chat.innerHTML = "";

        historyPanel.classList.remove(
            "open"
        );

        await ensureChat();

    }
);


/* =========================
   ЗАКРИТИ ІСТОРІЮ
   ========================= */

document.getElementById(
    "closeHistory"
).addEventListener(
    "click",
    function() {

        historyPanel.classList.remove(
            "open"
        );

    }
);


/* =========================
   СВАЙП ДЛЯ ІСТОРІЇ
   ========================= */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;

    },
    { passive: true }
);


document.addEventListener(
    "touchend",
    function(event) {

        const touchEndX =
            event.changedTouches[0].clientX;

        const touchEndY =
            event.changedTouches[0].clientY;

        const deltaX =
            touchEndX - touchStartX;

        const deltaY =
            touchEndY - touchStartY;


        /* Не реагуємо
           на вертикальне гортання */

        if (
            Math.abs(deltaY) >
            Math.abs(deltaX)
        ) {

            return;
        }


        /* ЛІВОРУЧ → ВПРАВО */

        if (
            touchStartX < 35 &&
            deltaX > 70
        ) {

            historyPanel.classList.add(
                "open"
            );

            loadChats();

        }


        /* ВПРАВО → ВЛІВО */

        if (
            historyPanel.classList.contains(
                "open"
            ) &&
            deltaX < -70
        ) {

            historyPanel.classList.remove(
                "open"
            );

        }

    },
    { passive: true }
);


/* =========================
   PREMIUM
   ========================= */

async function loadUsage() {

    try {

        const response =
            await fetch("/usage");

        const data =
            await response.json();


        if (
            data.plan === "premium"
        ) {

            document.getElementById(
                "planTitle"
            ).textContent =
                "⭐ Premium";

        } else {

            document.getElementById(
                "planTitle"
            ).textContent =
                "🆓 Безкоштовний план";

        }


        document.getElementById(
            "photoLimit"
        ).textContent =
            data.photos.remaining +
            "/" +
            data.photos.limit;


        document.getElementById(
            "videoLimit"
        ).textContent =
            data.videos.remaining +
            "/" +
            data.videos.limit;


        document.getElementById(
            "documentLimit"
        ).textContent =
            data.documents.remaining +
            "/" +
            data.documents.limit;


        document.getElementById(
            "messageLimit"
        ).textContent =
            data.messages.remaining +
            "/" +
            data.messages.limit;

    } catch (error) {

        console.log(
            "Помилка Premium:",
            error
        );

    }
}


/* =========================
   МІКРОФОН
   ========================= */

let recognition = null;
let isRecording = false;

if (
    "webkitSpeechRecognition"
    in window
) {

    recognition =
        new webkitSpeechRecognition();

} else if (
    "SpeechRecognition"
    in window
) {

    recognition =
        new SpeechRecognition();
}


if (recognition) {

    recognition.lang =
        "uk-UA";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            isRecording = true;

            microphoneButton.classList.add(
                "recording"
            );

        };


    recognition.onend =
        function() {

            isRecording = false;

            microphoneButton.classList.remove(
                "recording"
            );

        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                .transcript;

            messageInput.value +=
                text;

            messageInput.focus();

        };


    microphoneButton.addEventListener(
        "click",
        function() {

            if (isRecording) {

                recognition.stop();

            } else {

                recognition.start();

            }

        }
    );
}


/* =========================
   ЗАПУСК
   ========================= */

loadUsage();
loadChats();

</script>

</body>
</html>
