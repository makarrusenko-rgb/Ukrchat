plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ukrchat.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.ukrchat.app"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
